name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Single source of truth for the JDK is libs.versions.toml.
      - name: Read JDK version
        id: jdk
        run: echo "version=$(sed -nE 's/^jdk = "([0-9]+)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - uses: gradle/actions/setup-gradle@v6

      # Overrides the local org.gradle.java.home in gradle.properties.
      - name: Point Gradle at runner JDK
        run: echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

      - name: Build and unit test
        run: ./gradlew assembleDebug testDebugUnitTest
