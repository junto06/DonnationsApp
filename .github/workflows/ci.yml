name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level filtering: a skipped job still reports success, so both can be required checks.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            workflow:
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
            android:
              - '**'
              - '!backend/**'
          # A file must match every pattern in a filter, so android means "anything outside backend/".
          predicate-quantifier: every

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Single source of truth for the JDK is libs.versions.toml.
      - name: Read JDK version
        id: jdk
        run: echo "version=$(sed -nE 's/^jdk = "([0-9]+)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - uses: gradle/actions/setup-gradle@v6

      # Overrides the local org.gradle.java.home in gradle.properties.
      - name: Point Gradle at runner JDK
        run: echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties

      - name: Build and unit test
        run: ./gradlew assembleDebug test

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Read JDK version
        id: jdk
        run: echo "version=$(sed -nE 's/^jdk = "([0-9]+)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: backend

      - name: Build and test
        run: ./gradlew build
